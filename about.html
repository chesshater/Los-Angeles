    <style type="text/css">
   .header{background-color:RGBA(67,122,167,1.0);

   .header div{WIDTH:50%;
		float:left
		}
   .main
	{
	background-image:url("universal-studios-hollywood-hero1.jpg");
	padding:180;
	background-size:cover;
	background-attachment:fixed;
	text-align:center;
	float:inherit;
	opacity:0.5;

	font-size:20px;
	}

   .content
	{
	background-color:RGB(167,180,214);

	}
   .footer

	background-color:RGB(254,255,214);

	}
   .stand{
	background-color:black;
	opacity:0.7;

	 }
   .content ol
	{background:RGB(105,129,195);
	list-style:upper-roman;

	}
   .content ol li
	{background:RGB(21,49,127);

	}
    #hoi{transition:transform 4s;}
    #hoi:hover{transform:rotate(180deg);}
    #hoi2{transition:transform 4s;}
    #hoi2:hover{transform:scaleX(1.5) scaleY(2);}
    #hoi3{transition:transform 4s linear;}
    #hoi3:hover{transform:rotate(180deg);}
    nav{float:right}
    nav ul{list-style:none}
    nav li{display:inline-block;
	   padding:20px;
	   position:relative;}
    nav a{text-decoration:none}
    nav a:hover{color:#15177F}
    nav a:before{content:'';
		  display:block;
		  position:absolute;
		  top:0;
		  height:5px;
		  background-color:#15177F;
		  width:0%;
		  transition:width ease-in-out 0.25s;
		 }
    a:hover:before{width:50%}
         </style>
