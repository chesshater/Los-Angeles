    nav a:before{content:'';

		  position:absolute;

		  background-color:#15177F;
		  width:0%;
		  transition:width ease-in-out 0.25s;
		 }
    a:hover:before{width:50%}
.circle{background-image:url(air.png);
	   height:103px;
	   width:83px;
	   border-radius:50%;
	   position:absolute;
	   animation:sujata;
	   animation-duration:10s;
	   animation-iteration-count:infinite;
}
@keyframes sujata{
	   0%{top:100px;left:100px;background-color:RGB(244,122,233)
}
	   25%{top:100px;left:1300px;
	       transform:rotate(90deg)
}
	   50%{top:500px;left:1300px;
	       transform:rotate(180deg)
}
	   75%{top:500px;left:100px;
	       transform:rotate(270deg)
}
	   100%{top:100px;left:100px;
	       transform:rotate(360deg)
}}
